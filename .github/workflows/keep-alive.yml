# Keeps the free-tier services awake so the site has its data ready whenever it's opened.
#  - Render (backend) sleeps after 15 min without traffic -> pinged on every run.
#  - Supabase pauses a project after ~7 days without activity -> queried on every run.
# GitHub runs scheduled jobs late on busy days (often hourly), which is still far
# inside Supabase's 7-day window.
#
# Needs these repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL       same as VITE_SUPABASE_PROJECT_URL
#   SUPABASE_ANON_KEY  same as VITE_SUPABASE_PUBLISHABLE_KEY
name: keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

env:
  # Public address, so it lives here rather than in a secret
  BACKEND_URL: https://dev-urandom-lvl1313-backend.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake backend (also touches Supabase via /api/health)
        run: |
          # A cold start on Render can take ~50s, hence the long timeout + retries
          curl -fsS --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            "${BACKEND_URL%/}/api/health"

      - name: Ping Supabase directly
        if: ${{ always() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Tolerate stray spaces, line breaks or quotes pasted into the secrets
          clean() { printf '%s' "$1" | tr -d ' \r\n"'"'"; }
          url=$(clean "$SUPABASE_URL"); key=$(clean "$SUPABASE_ANON_KEY")
          if [ -z "$url" ]; then echo "SUPABASE_URL secret not set, skipping"; exit 0; fi
          curl -fsS --max-time 30 --retry 3 --retry-delay 5 \
            -H "apikey: $key" \
            -H "Authorization: Bearer $key" \
            "${url%/}/rest/v1/posts?select=id&limit=1"
